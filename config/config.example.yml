# Curatarr Configuration
# Core settings for Plex recommendations

# Plex Server Connection
plex:
  url: http://YOUR_PLEX_URL:32400  # Or https://YOUR-SERVER.plex.direct:32400
  # Or set PLEX_URL in the environment (takes precedence)
  token: YOUR_PLEX_TOKEN  # Get from: https://support.plex.tv/articles/204059436
  # Or set PLEX_TOKEN in the environment (takes precedence)
  movie_library: Movies
  tv_library: TV Shows

# TMDB API (required for metadata)
tmdb:
  api_key: YOUR_TMDB_API_KEY  # Get free key from: https://www.themoviedb.org/settings/api
  # Or set TMDB_API_KEY in the environment (takes precedence)

# Users and Preferences
users:
  list: user1, user2, kids  # Plex usernames (comma-separated)
  preferences:
    user1:
      display_name: User One
      exclude_genres:  # Optional: genres to exclude
        - horror
      # Optional, for external recommendations (recommenders/external.py) -
      # adds to (never replaces) the top-level streaming_services list
      # above, same merge behavior as exclude_genres.
      streaming_services:
        - netflix
        - disney_plus
    user2:
      display_name: User Two
      max_rating: PG-13  # Filter out R and NC-17 movies
      # Optional: overrides movies.franchise_order (tuning.yml) for this
      # person only. Franchise ordering walks you through a series in
      # release order instead of handing you whichever entry scored
      # highest - some people want that, some want tonight's best match
      # regardless of where it falls in a series. Unset = follow
      # tuning.yml.
      franchise_order: false
    kids:
      display_name: Kids
      exclude_genres:
        - horror
        - thriller
      max_rating: PG  # Only G and PG content
      # Content ratings: Movies (G < PG < PG-13 < R < NC-17)
      #                  TV (TV-Y < TV-Y7 < TV-G < TV-PG < TV-14 < TV-MA)

# General Settings
general:
  plex_only: true  # Only recommend from Plex library
  log_retention_days: 7
  # Internal candidate-scoring buffer for the Plex-library recommender
  # (recommenders/movie.py / tv.py) - advanced, rarely needed. Each run
  # scores this many candidates before trimming to the final
  # movies:/tv: limit_results count (see tuning.example.yml), so the
  # best-scoring items can compete against whatever a prior run already
  # added to the recommendation collection. Defaults to 2x
  # limit_results if unset (e.g. 100 for the default movies
  # limit_results: 50); an explicit value smaller than limit_results is
  # honored exactly as configured, never clamped up.
  # limit_plex_results: 100
  # notify (default): show a one-line CLI notice / web UI banner when a
  #   newer release exists, never applies anything automatically.
  # force: auto-apply verified signed updates on launch, no prompt
  #   (source installs only - see run.sh/run.ps1).
  # off: never check for updates.
  update_mode: notify
  # Prunes cache/ files left behind by users no longer in your
  # users.list (removed-user watched caches, external_recs_<user>_*
  # exports, etc.) - see utils/cache_prune.py. enabled: true just logs
  # what it *would* remove every run; nothing is deleted until you also
  # set dry_run: false. Conservative on purpose: only ever considers
  # the exact per-user cache filename patterns curatarr itself
  # generates (never all_movies_cache.json/all_shows_cache.json or
  # anything it doesn't recognize).
  # cache_prune:
  #   enabled: true
  #   dry_run: true

# Optional: in-app scheduler (#264) - runs the full recommendation
# pipeline (movie + tv + external, same as `full` on the Run screen) at
# a fixed daily time from inside this same process, no host cron or
# separate container needed. Off by default.
#
# Coexists with, does NOT replace, the host-cron / docker-compose.yml
# `schedule` profile approach documented in docs/DOCKER.md - pick ONE.
# The two share the same cross-container run lock, so they can never
# OVERLAP, but nothing stops both firing at different times of day if
# you enable this while host cron/the compose profile is also active.
#
# Timezone is always this container's own TZ environment variable
# (falls back to UTC if TZ is unset) - there is no separate timezone
# key here, so there's exactly one clock to reason about, not two that
# could disagree. The web UI's Settings screen shows the resolved
# timezone and the computed next-run time so it's never ambiguous.
#
# If a scheduled run's target time arrives while another run (web-UI-
# triggered, or the compose `schedule` profile's sibling container) is
# already in progress, that occurrence is skipped (logged) - never
# queued. Missed occurrences (e.g. the container was down at 3am) are
# never caught up on the next start - only the next real occurrence
# ever fires.
schedule:
  enabled: false
  time: "03:00"  # 24-hour HH:MM, local to the TZ above
  # weekdays:               # optional; omit (or leave empty) for every day
  #   - monday
  #   - wednesday
  #   - friday

# Huntarr: Find missing/upcoming movies from collections
huntarr:
  sequel_huntarr: true    # Missing movies from collections you've started
  horizon_huntarr: true   # Upcoming unreleased movies from collections you own

# Optional: Logging level and format
logging:
  # off / quiet / verbose (#284) - default: quiet. Maps onto standard
  # Python logging levels internally (off -> ERROR, quiet -> INFO,
  # verbose -> DEBUG) rather than inventing a parallel severity system:
  #   quiet   (default) - recommender run start/completion/failure per
  #           engine and user with final counts; scheduled-run
  #           confirmations; unhandled errors; and any external API
  #           (Plex/TMDB/Tautulli/Sonarr/Radarr/Trakt/Simkl/MDBList)
  #           failure - a bad token, expired auth, or rate limit is
  #           surfaced immediately here rather than as an unexplained
  #           no recommendations.
  #   verbose - all of the above, plus per-item filtering decisions,
  #           discovery iterations, and cache hits.
  #   off     - near-silence; errors only.
  # Also overridable via the CURATARR_LOG_LEVEL environment variable
  # (takes precedence over this - useful for a one-off troubleshooting
  # run without editing config.yml).
  verbosity: quiet
  # Advanced/legacy: an explicit level here (DEBUG, INFO, WARNING, or
  # ERROR) takes precedence over verbosity above - only set this if you
  # specifically need WARNING (the one standard level with no
  # verbosity-tier equivalent) or already rely on this exact key. Leave
  # unset (the default) to use verbosity instead.
  # level: INFO
  # format: text (default) - colored, human-readable console output.
  # format: json - structured JSON-lines (one JSON object per log line:
  #   timestamp, level, logger, message, plus any extra fields a call
  #   site attaches) for log aggregators/SIEMs. Secrets are redacted the
  #   same way either format.
  # format: text

# Optional: Multi-library support
# Define one entry per Plex library you want Curatarr to manage separately
# (e.g. "Movies" and "Kids Movies", or "TV Shows" and "Anime"). Each entry's
# `arr` block is optional - any field left out falls back to the matching
# global radarr.yml/sonarr.yml setting for that media_type. `instance` is
# also optional, for routing a specific library to its own *arr instance
# instead of the default one configured in radarr.yml/sonarr.yml.
# If this section is omitted entirely, Curatarr falls back to the single
# movie_library/tv_library above (unchanged legacy behavior).
# libraries:
#   - id: movies              # stable slug; auto-derived from name if omitted
#     name: Movies
#     section: Movies          # Plex section title
#     media_type: movie        # movie | tv
#     arr:                     # optional; each field falls back to global sonarr/radarr
#       root_folder: /data/movies
#       quality_profile: HD-1080p
#       tag: Curatarr
#       monitor: false
#       search: false
#       minimum_availability: released   # movie-only
#   - id: tv-shows
#     name: TV Shows
#     section: TV Shows
#     media_type: tv
#     arr:
#       root_folder: /data/tv
#       quality_profile: HD-1080p
#       series_type: standard            # tv-only
#       instance:               # optional per-library *arr instance; falls back to global block
#         url: http://localhost:8989
#         api_key: YOUR_SONARR_API_KEY

# Optional: Tautulli watch-history integration
# Supplements Plex's own watch history with history from Tautulli, weighted
# the same way. Mainly useful for shared/external users whose Plex-native
# history retention is thin. Users are matched to Plex accounts by email
# (falls back to username). Disabled by default; if unreachable or a user
# can't be matched, Curatarr silently falls back to Plex-only history.
tautulli:
  enabled: false
  url: http://YOUR_TAUTULLI_URL:8181  # e.g. http://192.168.1.10:8181
  api_key: YOUR_TAUTULLI_API_KEY  # Settings -> Web Interface -> API Key
  # Or set TAUTULLI_API_KEY in the environment (takes precedence, #289)

# Optional: curacast live-TV watch-credit integration
# curacast (a sibling product) plays a Plex library back through simulated
# TV channels and marks watched items via Plex's own /:/scrobble endpoint -
# that bumps viewCount but never creates a /status/sessions/history/all
# row, so live-TV viewing is otherwise invisible to Curatarr's profile.
# Supplements the profile with curacast's own graded watch-credit feed,
# weighted by tier (sampled/tasted/partial/substantial/complete) and
# recency, the same way Plex/Tautulli history is. Disabled by default; if
# unreachable or misconfigured, Curatarr silently falls back to Plex-only
# history.
curacast:
  enabled: false          # Optional: pull live-TV watch credits from a curacast server
  url: ""                 # e.g. http://localhost:8000
  api_key: ""
  # Or set CURACAST_API_KEY in the environment (takes precedence, #289)
  min_weight: 0.4          # Ignore credits below this weight (0.4 = "partial" and up)
  exclude_at_weight: 0.8   # Credits at/above this weight also count as "already watched" for recommendation exclusion (0.8 = "substantial", i.e. >=70% of the program seen)
  username: ""             # Optional: restrict to one curacast viewer; blank = the configured Plex user

# =============================================================================
# OPTIONAL MODULE FILES (in this directory)
# =============================================================================
# For advanced configuration, create these optional files alongside config.yml:
#
#   tuning.yml    - Display options, weights, quality filters, scoring params
#   trakt.yml     - Trakt.tv integration (sync lists, import watchlist)
#   radarr.yml    - Radarr integration (auto-add movies)
#   sonarr.yml    - Sonarr integration (auto-add shows)
#
# Copy from *.example.yml files and customize as needed.
# =============================================================================
